[package]
name = "pipeline-gen"
version = "1.0.3"
edition = "2024"

description = "Designed to be lightweight, easy to understand, and ready to grow with custom processing logic"
repository = "https://github.com/lukas-sgx/pipeline-gen"
license = "MIT"

[dependencies]
reqwest = "0.13.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
quick-xml = { version = "0.36", features = ["serialize"] }
anyhow = "1.0.104"
indicatif = "0.18.6"

[profile.release]
strip = true
opt-level = "z"
codegen-units = 1

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]