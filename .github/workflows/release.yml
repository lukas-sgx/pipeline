name: Release Stable

on:
  workflow_run:
    workflows: ["pipeline-gen - CI"]
    types: [completed]
    branches: [stable]

jobs:
  release:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: write

    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: stable
          config-file: release-config.json
          manifest-file: .release-manifest.json

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          fetch-depth: 0
          ref: stable

  build-deploy:
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ${{ matrix.platform.os || 'ubuntu-latest' }}
    strategy:
      matrix:
        platform:
          - name: linux-x86_64
            target: x86_64-unknown-linux-musl
            use-cross: true
            output: pipeline-gen
            release: ${{ needs.release.outputs.tag_name }}-linux-x86_64
            
          - name: linux-aarch64
            target: aarch64-unknown-linux-musl
            use-cross: true
            output: pipeline-gen
            release: ${{ needs.release.outputs.tag_name }}-linux-aarch64
            
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
            output: pipeline-gen.exe
            release: ${{ needs.release.outputs.tag_name }}-windows-x86_64.exe

    steps:
    - uses: actions/checkout@v6
    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.platform.target }}

    - name: Cache Cargo Dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.platform.target }}
      
    - name: Install Cross
      if: matrix.platform.use-cross
      run: cargo install cross

    - name: Build - ${{ matrix.platform.name }}
      run: |
        if [ "${{ matrix.platform.use-cross }}" = "true" ]; then
          cross build -r --target ${{ matrix.platform.target }}
        else
          cargo build -r --target ${{ matrix.platform.target }}
        fi
      shell: bash

    - name: Push Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: pipeline-gen-${{ matrix.platform.name }}
        path: target/${{ matrix.platform.target }}/release/${{ matrix.platform.output }}
        retention-days: 5

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: pipeline-gen-${{ matrix.platform.name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    needs: [release, build-deploy]
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish